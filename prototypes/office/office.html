// ---------------------------------------------------------------- textures
// Everything is drawn in code: no image assets to license.
function tex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h
  const g = c.getContext('2d'); draw(g, w, h)

  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8
  t.wrapS = t.wrapT = THREE.RepeatWrapping

}
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647 })()
const shade = (hex, f) => { const c = new THREE.Color(hex); c.offsetHSL(0, 0, f); return '#' + c.getHexString() }

function woodGrain(base, w = 512, h = 256, planks = 1, contrast = 1) {
  return (g) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h)
    for (let p = 0; p < planks; p++) {
      const y0 = (h / planks) * p, ph = h / planks
      g.fillStyle = shade(base, (rnd() - 0.5) * 0.06 * contrast); g.fillRect(0, y0, w, ph)
      for (let i = 0; i < 46; i++) {
        const y = y0 + rnd() * ph, amp = 1 + rnd() * 3
        g.strokeStyle = rnd() < 0.5 ? shade(base, -0.05 - rnd() * 0.06) : shade(base, 0.03 + rnd() * 0.04)
        g.globalAlpha = (0.35 + rnd() * 0.4) * contrast; g.lineWidth = 0.6 + rnd() * 1.6
        g.beginPath(); g.moveTo(0, y)
        for (let x = 0; x <= w; x += 16) g.lineTo(x, y + Math.sin(x / (40 + rnd() * 30) + i) * amp)
        g.stroke()
      }
      g.globalAlpha = 1
      if (planks > 1) { g.fillStyle = shade(base, -0.07 * contrast); g.fillRect(0, y0, w, 2); const cut = rnd() * w; g.fillRect(cut, y0, 2, ph) }
    }
  }
}
const T = {
  walnut: tex(512, 256, woodGrain('#8b5a36')),
  walnutDark: tex(512, 256, woodGrain('#5f3b23')),
  floorWood: tex(512, 512, woodGrain('#4b3326', 512, 512, 8, 0.45), [3, 3]),
  carpet: tex(256, 256, (g, w, h) => {
    // 2x2 carpet tiles with per-tile tint, fibre speckle and seams.
    for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) {
      g.fillStyle = shade('#6d7585', (rnd() - 0.5) * 0.025); g.fillRect(tx * 128, ty * 128, 128, 128)
    }
    for (let i = 0; i < 9000; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(40,46,58,.28)' : 'rgba(150,160,178,.22)'; g.fillRect(rnd() * w, rnd() * h, 1.2, 1.2) }
    g.strokeStyle = 'rgba(30,35,45,.16)'; g.lineWidth = 1.5
    g.strokeRect(1, 1, 127, 127); g.strokeRect(129, 1, 126, 127); g.strokeRect(1, 129, 127, 126); g.strokeRect(129, 129, 126, 126)
  }, [8, 6]),
  tile: tex(256, 256, (g, w, h) => {
    for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) {
      const grd = g.createLinearGradient(tx * 128, ty * 128, tx * 128 + 128, ty * 128 + 128)
      grd.addColorStop(0, shade('#e2ded6', 0.02)); grd.addColorStop(1, shade('#d2cdc3', (rnd() - 0.5) * 0.02))
      g.fillStyle = grd; g.fillRect(tx * 128, ty * 128, 128, 128)
    }
    g.strokeStyle = '#b8b2a7'; g.lineWidth = 4
    for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 128); g.lineTo(w, i * 128); g.stroke() }
  }, [3, 3]),
  rug: tex(512, 384, (g, w, h) => {
    g.fillStyle = '#7f8794'; g.fillRect(0, 0, w, h)
    g.strokeStyle = '#5e6572'; g.lineWidth = 18; g.strokeRect(18, 18, w - 36, h - 36)
    g.strokeStyle = '#a3aab5'; g.lineWidth = 4; g.strokeRect(40, 40, w - 80, h - 80)
    for (let i = 0; i < 6000; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.06)'; g.fillRect(rnd() * w, rnd() * h, 1.5, 1.5) }
  }),
  wall: tex(64, 256, (g, w, h) => { const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, '#2b3f60'); grd.addColorStop(1, '#152238'); g.fillStyle = grd; g.fillRect(0, 0, w, h) }),
  glass: tex(256, 128, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, w, h); grd.addColorStop(0, '#9fe3f2'); grd.addColorStop(1, '#4fb3cd'); g.fillStyle = grd; g.fillRect(0, 0, w, h)
    g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.moveTo(w * 0.15, 0); g.lineTo(w * 0.3, 0); g.lineTo(w * 0.12, h); g.lineTo(0, h); g.fill()
    g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.moveTo(w * 0.42, 0); g.lineTo(w * 0.48, 0); g.lineTo(w * 0.3, h); g.lineTo(w * 0.24, h); g.fill()
  }),
  drawers: tex(128, 256, (g, w, h) => {
    g.fillStyle = '#3a4252'; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 2; i++) { g.fillStyle = '#454e60'; g.fillRect(8, 10 + i * 124, w - 16, 112); g.fillStyle = '#9aa4b2'; g.fillRect(w / 2 - 18, 22 + i * 124, 36, 7) }
  }),
  cabinet: tex(256, 512, (g, w, h) => {
    g.fillStyle = '#4a5468'; g.fillRect(0, 0, w, h)
    for (let i = 0; i < 4; i++) { g.fillStyle = '#56617a'; g.fillRect(10, 10 + i * 125, w - 20, 113); g.fillStyle = '#c3cad4'; g.fillRect(w / 2 - 26, 24 + i * 125, 52, 8) }
  }),
  keyboard: tex(256, 96, (g, w, h) => {

  }),

    for (let i = 0; i < 9; i++) g.fillRect(14, 18 + i * 14, 50 + (i * 37) % 50, 4)
  }),
  printer: tex(256, 256, (g, w, h) => {
    g.fillStyle = '#e4e7eb'; g.fillRect(0, 0, w, h); g.fillStyle = '#c4c9d0'; g.fillRect(0, 150, w, 10)
    g.fillStyle = '#2f3540'; g.fillRect(20, 30, 90, 40); g.fillStyle = '#4fd1c5'; g.fillRect(28, 38, 30, 10)
    g.fillStyle = '#9aa3ad'; g.fillRect(20, 190, w - 40, 30)

  }),
  art: [['#7fb6d6', '#3e6f8f', '#e3c27a'], ['#c9e0e8', '#4f7c62', '#2f5a7a'], ['#f2c6a0', '#8a5a7a', '#3c5a8a']].map(([sky, hills, accent]) => tex(256, 160, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, sky); grd.addColorStop(1, '#ffffff'); g.fillStyle = grd; g.fillRect(0, 0, w, h)
    g.fillStyle = hills; g.beginPath(); g.moveTo(0, h); for (let x = 0; x <= w; x += 8) g.lineTo(x, h * 0.62 - Math.sin(x / 38) * 18 - Math.sin(x / 13) * 4); g.lineTo(w, h); g.fill()
    g.fillStyle = accent; g.beginPath(); g.arc(w * 0.72, h * 0.3, 16, 0, Math.PI * 2); g.fill()
    g.strokeStyle = '#2b2f36'; g.lineWidth = 14; g.strokeRect(0, 0, w, h)
  })),
}
function dashboard(accent) {
  return tex(256, 160, (g) => {
    g.fillStyle = '#0d2a4a'; g.fillRect(0, 0, 256, 160)
    g.fillStyle = accent; g.fillRect(0, 0, 256, 20)
    g.fillStyle = '#2b5f93'; g.fillRect(10, 30, 68, 120)
    g.fillStyle = '#9fd4ff'; for (let i = 0; i < 6; i++) g.fillRect(16, 38 + i * 18, 40 + (i * 13) % 20, 6)
    g.fillStyle = '#1c4a78'; g.fillRect(90, 30, 156, 70)
    g.strokeStyle = accent; g.lineWidth = 4; g.beginPath(); g.moveTo(96, 92)
    for (let i = 0; i <= 8; i++) g.lineTo(96 + i * 18, 92 - [8, 30, 18, 44, 26, 52, 36, 58, 48][i]); g.stroke()
    for (let i = 0; i < 4; i++) { g.fillStyle = i % 2 ? '#3d7dbf' : '#5fa8e8'; g.fillRect(90 + i * 40, 110, 32, 40) }
  })
}
const fabricTex = tex(128, 128, (g, w, h) => {
  for (let y = 0; y < h; y += 4) for (let x = 0; x < w; x += 4) {
    const twill = ((x / 4 + y / 4) % 4) < 2 ? 34 : -18
    const v = 128 + twill + (rnd() - 0.5) * 30
    g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, y, 4, 4)
  }
  for (let i = 0; i < 14; i++) { const r = g.createRadialGradient(rnd() * w, rnd() * h, 0, rnd() * w, rnd() * h, 30); r.addColorStop(0, 'rgba(255,255,255,.10)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, h) }
})
const blobTex = tex(64, 64, (g) => { const r = g.createRadialGradient(32, 32, 1, 32, 32, 31); r.addColorStop(0, 'rgba(0,0,0,1)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64) })

// ---------------------------------------------------------------- materials & builders
const matCache = new Map()
function mat(color, map, extra = {}) {
  const key = String(color) + (map ? map.uuid : '') + JSON.stringify(extra)
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, map: map || null, roughness: 0.82, metalness: 0, ...extra }))
  return matCache.get(key)
}
// Upholstery: woven fabric projected in world space (works on any model and
// survives merging), plus a soft darkening toward the floor for depth.
const fabricCache = new Map()
function fabricMat(color) {
  if (fabricCache.has(color)) return fabricCache.get(color)
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.95, metalness: 0 })
  m.onBeforeCompile = (sh) => {
    sh.uniforms.fabric = { value: fabricTex }
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos; varying vec3 vWNrm;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz; vWNrm = normalize(mat3(modelMatrix) * objectNormal);')
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform sampler2D fabric; varying vec3 vWPos; varying vec3 vWNrm;')
      .replace('#include <map_fragment>', `#include <map_fragment>
        vec3 bw = pow(abs(vWNrm), vec3(4.0)); bw /= (bw.x + bw.y + bw.z);
        float f = texture2D(fabric, vWPos.zy * 3.2).r * bw.x + texture2D(fabric, vWPos.xz * 3.2).r * bw.y + texture2D(fabric, vWPos.xy * 3.2).r * bw.z;
        diffuseColor.rgb *= (0.62 + 0.75 * f) * mix(0.55, 1.18, smoothstep(0.15, 0.95, vWPos.y));`)
  }
  m.customProgramCacheKey = () => 'fabric'
  fabricCache.set(color, m)
  return m
}
const M = {
  walnut: mat(0xffffff, T.walnut), walnutDark: mat(0xffffff, T.walnutDark), wall: mat(0xffffff, T.wall), wallCap: mat(0x34496b),
  glass: mat(0xffffff, T.glass, { roughness: 0.25 }), frame: mat(0x16233a), metalDark: mat(0x2b313c), metal: mat(0x9aa3ad, null, { metalness: 0.3, roughness: 0.5 }),
  drawers: mat(0xffffff, T.drawers), cabinet: mat(0xffffff, T.cabinet), keyboard: mat(0xffffff, T.keyboard), paper: mat(0xffffff, T.paper),
  white: mat(0xf2f2f0), counter: mat(0xe9e6df), printer: mat(0xffffff, T.printer), server: mat(0xffffff, T.server), screenOff: new THREE.MeshBasicMaterial({ color: 0x18202b }),
  planter: mat(0x3a4250), soil: mat(0x4a3628), mug: [mat(0xffffff), mat(0xd9604c), mat(0x4c9aff)],
}
// box(w,h,d, x,y,z, mats): mats is one material or { top, side, front } (front faces +z).
function box(w, h, d, x, y, z, m, rotY = 0) {
  const g = new THREE.BoxGeometry(w, h, d)
  const mm = m.isMaterial ? m : [m.side, m.side, m.top || m.side, m.side, m.front || m.side, m.back || m.side]
  const mesh = new THREE.Mesh(g, mm)
  mesh.position.set(x, y + h / 2, z); mesh.rotation.y = rotY
  mesh.castShadow = mesh.receiveShadow = true
  statics.add(mesh)
  return mesh
}
// Soft dark patch under furniture: cheap contact shadow / ambient occlusion.
const aoMat = new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, opacity: 0.42, depthWrite: false, color: 0x000000 })
function ao(x, z, w, d, o = 0.42) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), o === 0.42 ? aoMat : aoMat.clone())
  if (o !== 0.42) m.material.opacity = o
  m.rotation.x = -Math.PI / 2; m.position.set(x, 0.012, z); m.renderOrder = 1
  scene.add(m)
}
// Zone floors sit a hair above the carpet so they never z-fight with it.
let floorLayer = 0
function floor(x, z, w, d, t, tile = 2) {
  const tt = t.clone(); tt.needsUpdate = true; tt.repeat.set(w / tile, d / tile)
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat(0xffffff, tt))
  m.rotation.x = -Math.PI / 2; m.position.set(x, 0.001 + 0.0015 * floorLayer++, z); m.receiveShadow = true
  scene.add(m)
}

const gltf = new GLTFLoader()
const cache = new Map()
const load = (u) => { if (!cache.has(u)) cache.set(u, gltf.loadAsync(u)); return cache.get(u) }
const REMAP = { wood: 0x8b5a36, woodDark: 0x5f3b23, carpet: 0x2c4f86, carpetWhite: 0xeeeeee, metal: 0x9aa3ad, metalMedium: 0x343b47, metalDark: 0x2b313c, metalLight: 0xe3e7ec, plant: 0x3f9a4a, lamp: 0xfff1c8, glass: 0x9fe3f2 }
const S = 1.5
async function prop(name, x, z, rotY = 0, y = 0, opts = {}) {
  const g = await load(FURN + name + '.glb')
  const inner = g.scene.clone(true)
  inner.traverse((o) => {
    if (!o.isMesh) return
    o.castShadow = o.receiveShadow = true
    const r = { ...REMAP, ...(opts.remap || {}) }[o.material.name]
    const color = r !== undefined ? r : o.material.color.getHex()
    o.material = o.material.name === 'carpet' ? fabricMat(color) : mat(color)
  })
  const bb = new THREE.Box3().setFromObject(inner), c = bb.getCenter(new THREE.Vector3())
  inner.position.set(-c.x, -bb.min.y, -c.z)
  const holder = new THREE.Group(); holder.add(inner)
  holder.scale.setScalar(opts.s || S); holder.rotation.y = rotY; holder.position.set(x, y, z)
  statics.add(holder)
  if (!y && opts.ao !== false) { const sz = bb.getSize(new THREE.Vector3()).multiplyScalar(opts.s || S); const sw = Math.abs(Math.sin(rotY)) > 0.5; ao(x, z, (sw ? sz.z : sz.x) * 1.35, (sw ? sz.x : sz.z) * 1.35) }
  return holder
}

// ---------------------------------------------------------------- room shell
const WALL_H = 0.62, WT = 0.2
function wall(x1, z1, x2, z2, glass = 0) {
  const horiz = z1 === z2, len = Math.abs(horiz ? x2 - x1 : z2 - z1)
  const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2
  box(horiz ? len : WT, WALL_H, horiz ? WT : len, cx, 0, cz, { side: M.wall, top: M.wallCap })
  box(horiz ? len + WT : WT + 0.04, 0.05, horiz ? WT + 0.04 : len + WT, cx, WALL_H, cz, M.wallCap)
  if (!glass) return
  const n = Math.max(1, Math.round(len / glass))
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n, px = horiz ? x1 + (x2 - x1) * t : cx, pz = horiz ? cz : z1 + (z2 - z1) * t
    const pane = (len / n) * 0.78
    box(horiz ? pane : WT + 0.05, 0.36, horiz ? WT + 0.05 : pane, px, 0.17, pz, { side: M.glass, top: M.frame })
  }
}
// Glass partition with navy posts (meeting room front).
function glassPartition(x1, x2, z) {
  const len = x2 - x1
  box(len, 0.06, 0.1, (x1 + x2) / 2, 0, z, M.frame)
  box(len, 0.5, 0.06, (x1 + x2) / 2, 0.06, z, { side: M.glass, top: M.frame })
  for (let x = x1; x <= x2 + 0.01; x += len / 4) box(0.1, 0.6, 0.12, x, 0, z, M.frame)
}

// Floors per zone.
floor(0, 0, W, D, T.carpet, 1.3)
floor(-5.5, -3.25, 5, 4.5, T.floorWood)        // executive office

// ---------------------------------------------------------------- merge statics
function mergeStatics() {
  statics.updateMatrixWorld(true)
  const groups = new Map()
  statics.traverse((o) => {
    if (!o.isMesh) return
    const mats = Array.isArray(o.material) ? o.material : [o.material]
    let g = o.geometry.clone().applyMatrix4(o.matrixWorld)
    const parts = mats.length > 1 ? g.groups.map((gr) => ({ g: slice(g, gr), m: mats[gr.materialIndex] })) : [{ g: g.index ? g.toNonIndexed() : g, m: mats[0] }]
    for (const { g: pg, m } of parts) {
      for (const key of Object.keys(pg.attributes)) if (!['position', 'normal', 'uv'].includes(key)) pg.deleteAttribute(key)
      if (!pg.attributes.uv) pg.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(pg.attributes.position.count * 2), 2))
      if (!groups.has(m.uuid)) groups.set(m.uuid, { m, list: [] })
      groups.get(m.uuid).list.push(pg)
    }
  })
  statics.clear()
  for (const { m, list } of groups.values()) {
    const merged = mergeGeometries(list, false)
    if (!merged) continue
    const mesh = new THREE.Mesh(merged, m); mesh.castShadow = mesh.receiveShadow = true
    statics.add(mesh)
  }
}
function slice(g, gr) {
  const src = g.index ? g.toNonIndexed() : g
  const out = new THREE.BufferGeometry()
  for (const [k, a] of Object.entries(src.attributes)) out.setAttribute(k, new THREE.BufferAttribute(a.array.slice(gr.start * a.itemSize, (gr.start + gr.count) * a.itemSize), a.itemSize))
  return out
}

const actors = []
async function person(file, x, z, rotY, clip, label, y = 0) {
  const g = await load(KEN + file + '.glb')
  const model = SkeletonUtils.clone(g.scene)
  model.traverse((o) => { if (o.isMesh) { o.material = new THREE.MeshStandardMaterial({ map: o.material.map, roughness: 0.85 }); o.castShadow = false } })
  const h = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3()).y
  model.scale.setScalar(0.95 / h)
  const root = new THREE.Group(); root.add(model)
  root.position.set(x, y, z); root.rotation.y = rotY
  const b = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.55), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, opacity: 0.35, depthWrite: false, color: 0 }))
  b.rotation.x = -Math.PI / 2; b.position.y = 0.012 - y; root.add(b)
  scene.add(root)
  const mixer = new THREE.AnimationMixer(model)
  mixer.clipAction(THREE.AnimationClip.findByName(g.animations, clip)).play()
  if (label) {
    const el = document.createElement('div'); el.className = 'tag'; el.style.setProperty('--accent', label.accent)
    el.innerHTML = (label.bubble ? `<div class="bubble ${label.kind || ''}">${label.bubble}</div>` : '') + `<div class="name">${label.name}${label.role ? ` <span class="role">· ${label.role}</span>` : ''}</div>`
    const t = new CSS2DObject(el); t.position.set(0, 1.25, 0); root.add(t)
  }
  const a = { root, mixer }
  actors.push(a)
  return a
}

// ---------------------------------------------------------------- loop
const hud = document.getElementById('hud')
const timer = new THREE.Timer()
let last = 0, acc = 0, frames = 0, cpu = 0
window.__frames = 0
function frame(now) {
  requestAnimationFrame(frame)
  if (document.hidden || now - last < 1000 / FPS_CAP - 1) return
  last = now
  timer.update(now)
  const dt = Math.min(timer.getDelta(), 0.1)
  const t0 = performance.now()
  for (const a of actors) a.mixer.update(dt)
  walker.root.position.x += dt * 0.45
  if (walker.root.position.x > walker.path[1]) walker.root.position.x = walker.path[0]
  renderer.render(scene, camera)
  labels.render(scene, camera)
  cpu += performance.now() - t0; frames++; window.__frames++
  if (now - acc > 1000) { hud.textContent = `${frames} fps (cap ${FPS_CAP}) · ${(cpu / frames).toFixed(1)} ms CPU · ${renderer.info.render.calls} draw calls · ${(renderer.info.render.triangles / 1000).toFixed(0)}k tris`; acc = now; frames = 0; cpu = 0 }
}
requestAnimationFrame(frame)

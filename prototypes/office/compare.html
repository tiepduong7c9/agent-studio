const matCache = new Map()
const toon = (color, map) => {
  const c = new THREE.Color(color)
  const key = c.getHexString() + (map ? map.uuid : '')
  if (!matCache.has(key)) matCache.set(key, SOFT
    ? new THREE.MeshStandardMaterial({ color: c, map: map || null, roughness: 0.85, metalness: 0 })
    : new THREE.MeshToonMaterial({ color: c, map: map || null, gradientMap: ramp }))
  return matCache.get(key)
}
function toonify(root, remap) {
  root.traverse((o) => {
    if (!o.isMesh) return
    o.castShadow = o.receiveShadow = true
    const mats = Array.isArray(o.material) ? o.material : [o.material]
    const out = mats.map((m) => { const h = remap?.[m.name]; return toon(h !== undefined ? h : m.color, m.map) })
    o.material = Array.isArray(o.material) ? out : out[0]
  })
}

const gltf = new GLTFLoader(), fbx = new FBXLoader()
const cache = new Map()
const loadG = (u) => { if (!cache.has(u)) cache.set(u, gltf.loadAsync(u)); return cache.get(u) }
const loadF = (u) => { if (!cache.has(u)) cache.set(u, fbx.loadAsync(u)); return cache.get(u) }

const S = 1.5
async function prop(name, x, z, rotY = 0, y = 0) {
  const g = await loadG(FURN + name + '.glb')
  const inner = g.scene.clone(true)
  toonify(inner, { ...REMAP.default, ...(REMAP[name] || {}) })
  const box = new THREE.Box3().setFromObject(inner)
  const c = box.getCenter(new THREE.Vector3())
  inner.position.set(-c.x, -box.min.y, -c.z)
  const holder = new THREE.Group()
  holder.add(inner)
  holder.scale.setScalar(S)
  holder.rotation.y = rotY
  holder.position.set(x, y, z)
  statics.add(holder)
}
function box(w, h, d, color, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), toon(color))
  m.position.set(x, y + h / 2, z)
  m.castShadow = m.receiveShadow = true
  statics.add(m)
}
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h
  draw(c.getContext('2d'), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat) }
  return t
}
const hex = (n) => '#' + n.toString(16).padStart(6, '0')

}, [12, 5])

    g.fillStyle = '#1c4a78'; g.fillRect(92, 32, 154, 70)
    g.strokeStyle = accent; g.lineWidth = 4; g.beginPath(); g.moveTo(98, 92)
    for (let i = 0; i <= 8; i++) g.lineTo(98 + i * 18, 92 - [8, 30, 18, 44, 26, 52, 36, 58, 48][i])

    for (let i = 0; i < 4; i++) { g.fillStyle = i % 2 ? '#3d7dbf' : '#5fa8e8'; g.fillRect(92 + i * 40, 112, 32, 38) }

}

// Merge every static mesh into one geometry per material: ~10 draw calls
// instead of ~300.
function mergeStatics() {
  statics.updateMatrixWorld(true)
  const groups = new Map()
  statics.traverse((o) => {
    if (!o.isMesh) return
    const mats = Array.isArray(o.material) ? o.material : [o.material]
    let g = o.geometry.clone().applyMatrix4(o.matrixWorld)
    if (g.index) g = g.toNonIndexed()
    const parts = mats.length > 1 && g.groups.length ? g.groups.map((gr) => ({ g: sliceGroup(g, gr), m: mats[gr.materialIndex] })) : [{ g, m: mats[0] }]
    for (const { g: pg, m } of parts) {
      for (const k of Object.keys(pg.attributes)) if (!['position', 'normal', 'uv'].includes(k)) pg.deleteAttribute(k)
      if (!m.map) pg.deleteAttribute('uv')
      else if (!pg.attributes.uv) continue
      const key = m.uuid
      if (!groups.has(key)) groups.set(key, { m, list: [] })
      groups.get(key).list.push(pg)
    }
  })
  statics.clear()
  for (const { m, list } of groups.values()) {
    const merged = mergeGeometries(list, false)
    if (!merged) continue
    const mesh = new THREE.Mesh(merged, m)
    mesh.castShadow = mesh.receiveShadow = true
    statics.add(mesh)
  }
}
function sliceGroup(g, gr) {
  const out = new THREE.BufferGeometry()
  for (const [k, a] of Object.entries(g.attributes)) out.setAttribute(k, new THREE.BufferAttribute(a.array.slice(gr.start * a.itemSize, (gr.start + gr.count) * a.itemSize), a.itemSize))
  return out
}
mergeStatics()

// ---- Characters. Each style exposes the same API: { root, play(state) }.
const actors = []
function addLabel(root, h, label) {
  const el = document.createElement('div')
  el.className = 'tag'
  el.style.setProperty('--accent', label.accent)
  el.innerHTML = (label.bubble ? `<div class="bubble ${label.kind || ''}">${label.bubble}</div>` : '') + `<div class="name">${label.name}</div>`
  const tag = new CSS2DObject(el)
  tag.position.set(0, h, 0)
  root.add(tag)
}
// Blob shadow so moving characters don't need the shadow map re-rendered.
const blobTex = canvasTex(64, 64, (g) => { const r = g.createRadialGradient(32, 32, 2, 32, 32, 30); r.addColorStop(0, 'rgba(0,0,0,.35)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64) })
function blob(root) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false }))
  m.rotation.x = -Math.PI / 2; m.position.y = 0.01
  root.add(m)
}
const TARGET_H = 0.95

async function kenney(file) {
  const g = await loadG(KEN + file + '.glb')
  const model = SkeletonUtils.clone(g.scene)
  toonify(model)
  model.traverse((o) => { if (o.isMesh) o.castShadow = false })
  const h = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3()).y
  model.scale.setScalar(TARGET_H / h)
  const root = new THREE.Group(); root.add(model)
  const mixer = new THREE.AnimationMixer(model)
  const clip = (n) => THREE.AnimationClip.findByName(g.animations, n)
  return { root, mixer, h: TARGET_H, seatY: 0.24, play(state) {
    const a = mixer.clipAction(clip({ typing: 'interact-right', sit: 'sit', walk: 'walk', idle: 'idle', lounge: 'sit' }[state])); a.play()
  } }
}

async function quaternius(file) {
  const src = await loadF(QUAT + file + '.fbx')
  const model = SkeletonUtils.clone(src)
  toonify(model)
  model.traverse((o) => { if (o.isMesh) o.castShadow = false })
  const h = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3()).y
  model.scale.setScalar(TARGET_H / h)
  const root = new THREE.Group(); root.add(model)
  const mixer = new THREE.AnimationMixer(model)
  const clip = (n) => src.animations.find((a) => a.name.endsWith('|' + n) || a.name === n)
  return { root, mixer, h: TARGET_H, seatY: 0.02, play(state) {
    const name = { typing: 'SitDown', sit: 'SitDown', lounge: 'SitDown', walk: 'Walk', idle: 'Idle' }[state]
    const a = mixer.clipAction(clip(name))
    if (name === 'SitDown') { a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true; a.time = clip(name).duration - 0.01 }
    a.play()
  } }
}

// C: a character assembled from primitives, animated procedurally. Every
// part is a parameter, which is what a character editor needs.
function shapes(look) {
  const mat = (c) => toon(c)
  const root = new THREE.Group()
  const body = new THREE.Group(); root.add(body)
  const cap = (r, len, c) => { const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 12), mat(c)); m.castShadow = false; return m }
  const limb = (r, len, c) => { const pivot = new THREE.Group(); const m = cap(r, len, c); m.position.y = -(len / 2 + r * 0.6); pivot.add(m); return pivot }
  // Proportions ~6.5 heads tall.
  const hip = new THREE.Group(); hip.position.y = 0.46; body.add(hip)
  const torso = cap(0.115, 0.2, look.shirt); torso.position.y = 0.17; torso.scale.set(1, 1, 0.75); hip.add(torso)
  if (look.jacket) { const j = cap(0.12, 0.17, look.jacket); j.position.y = 0.17; j.scale.set(1.04, 1, 0.8); hip.add(j); const tie = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.14, 0.01), mat(look.tie || 0x9b2c2c)); tie.position.set(0, 0.2, 0.1); hip.add(tie) }
  const neck = cap(0.04, 0.03, look.skin); neck.position.y = 0.34; hip.add(neck)
  const head = new THREE.Group(); head.position.y = 0.45; hip.add(head)
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.095, 20, 16), mat(look.skin)); skull.scale.set(1, 1.08, 1); head.add(skull)
  const eye = (x) => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.011, 8, 8), mat(0x1b1b1b)); e.position.set(x, 0.01, 0.088); head.add(e) }
  eye(-0.033); eye(0.033)
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.103, 20, 12, 0, Math.PI * 2, 0, look.hairStyle === 'long' ? Math.PI * 0.62 : Math.PI * 0.5), mat(look.hair))
  hair.position.y = 0.012; hair.rotation.x = -0.35; head.add(hair)
  if (look.hairStyle === 'bun') { const b = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), mat(look.hair)); b.position.set(0, 0.09, -0.06); head.add(b) }
  if (look.hairStyle === 'long') { const back = cap(0.075, 0.12, look.hair); back.position.set(0, -0.06, -0.05); back.scale.set(1.2, 1, 0.6); head.add(back) }
  if (look.glasses) { const g = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.005, 6, 16), mat(0x222222)); g.position.set(-0.033, 0.01, 0.092); head.add(g); const g2 = g.clone(); g2.position.x = 0.033; head.add(g2) }
  const sleeve = look.jacket || look.shirt
  const armL = limb(0.035, 0.13, sleeve), armR = limb(0.035, 0.13, sleeve)
  armL.position.set(-0.15, 0.3, 0); armR.position.set(0.15, 0.3, 0); hip.add(armL, armR)
  const foreL = limb(0.032, 0.11, look.skin), foreR = limb(0.032, 0.11, look.skin)
  foreL.position.y = -0.2; foreR.position.y = -0.2; armL.add(foreL); armR.add(foreR)
  const legL = limb(0.05, 0.16, look.pants), legR = limb(0.05, 0.16, look.pants)
  legL.position.set(-0.065, 0, 0); legR.position.set(0.065, 0, 0); hip.add(legL, legR)
  const shinL = limb(0.045, 0.15, look.pants), shinR = limb(0.045, 0.15, look.pants)
  shinL.position.y = -0.25; shinR.position.y = -0.25; legL.add(shinL); legR.add(shinR)
  const shoe = (p) => { const s = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.04, 0.13), mat(look.shoes || 0x222831)); s.position.set(0, -0.23, 0.03); p.add(s) }
  shoe(shinL); shoe(shinR)
  let state = 'idle'
  const api = { root, h: 1.05, seatY: 0, play(s) { state = s }, update(t) {
    const sit = state === 'sit' || state === 'typing' || state === 'lounge'
    hip.position.y = sit ? 0.36 : 0.46 + (state === 'walk' ? Math.abs(Math.sin(t * 8)) * 0.012 : Math.sin(t * 2) * 0.003)
    const sw = state === 'walk' ? Math.sin(t * 8) * 0.55 : 0
    legL.rotation.x = sit ? -1.5 : sw; legR.rotation.x = sit ? -1.5 : -sw
    shinL.rotation.x = sit ? 1.5 : Math.max(0, -sw) * 0.6; shinR.rotation.x = sit ? 1.5 : Math.max(0, sw) * 0.6
    if (state === 'typing') {
      armL.rotation.x = -0.55; armR.rotation.x = -0.55
      foreL.rotation.x = -1.0 + Math.sin(t * 18) * 0.12; foreR.rotation.x = -1.0 + Math.sin(t * 18 + 1.7) * 0.12
    } else if (sit) { armL.rotation.x = armR.rotation.x = -0.3; foreL.rotation.x = foreR.rotation.x = -0.8 }
    else { armL.rotation.x = -sw * 0.8; armR.rotation.x = sw * 0.8; foreL.rotation.x = foreR.rotation.x = -0.15 }
    if (state === 'alert') { head.rotation.y = Math.sin(t * 3) * 0.3 }
  } }
  return api
}

async function place(make, x, z, rotY, state, label) {
  const a = await make()
  a.root.position.set(x, (state === 'walk' || state === 'idle') ? 0 : a.seatY, z)
  a.root.rotation.y = rotY
  a.play(state)
  blob(a.root)
  if (label) addLabel(a.root, a.h * 1.25, label)
  scene.add(a.root)
  actors.push(a)
  return a
}

]
const looks = [
  { skin: 0xf1c7a1, hair: 0x6b3b1f, hairStyle: 'bun', shirt: 0xe8eef5, pants: 0x2b3442, jacket: 0x2d4a7a, tie: 0x8b1e3f },
  { skin: 0x8d5a3b, hair: 0x1c1c1c, hairStyle: 'short', shirt: 0xf3f3f3, pants: 0x3b3b3b, jacket: 0x3a3f47 },
  { skin: 0xe9b48a, hair: 0xd9a441, hairStyle: 'long', shirt: 0x7a5cc4, pants: 0x2b3442, glasses: true },
  { skin: 0xc68a5e, hair: 0x2e1d12, hairStyle: 'short', shirt: 0x3fa36b, pants: 0x4a5568 },
  { skin: 0xf5d0b5, hair: 0xb8432f, hairStyle: 'long', shirt: 0xd9604c, pants: 0x2f3b52 },
]
const styles = [
  { make: (i) => () => kenney(['character-female-b', 'character-male-c', 'character-female-d', 'character-male-a', 'character-female-a'][i]) },
  { make: (i) => () => quaternius(['Suit_Female', 'Suit_Male', 'Casual_Female', 'Casual2_Male', 'Worker_Female'][i]) },
  { make: (i) => () => shapes(looks[i]) },
]
let si = 0
for (const st of styles) {
  const cx = roomX[si]
  if (CLOSE) {
    // Line-up facing the camera: how the character manager would preview them.
    for (let i = 0; i < 5; i++) {
      const a = await place(st.make(i), cx - 1.8 + i * 0.9, 1.4, 0, i === 4 ? 'walk' : 'idle', null)
      a.root.rotation.y = i === 4 ? 0.5 : 0
    }
    si++
    continue
  }
  for (let i = 0; i < 3; i++) {
    const x = cx + [-2.2, -0.9, 0.4][i]
    const a = await place(st.make(i), x, -1.0 + 0.56, Math.PI, cast[i].s, cast[i].label)
    screens[si * 3 + i].material = new THREE.MeshBasicMaterial({ map: dashboard(cast[i].screen) })
  }
  await place(st.make(3), cx + 1.85, 0.62, 0, 'lounge', { name: 'swift-otter', accent: '#8b949e' })
  const w = await place(st.make(4), cx - 0.4, 1.3, Math.PI / 2, 'walk', { name: 'Zoe', accent: '#ff7b72' })
  w.walker = { from: cx - 2.4, to: cx + 0.6 }
  si++
}
renderer.shadowMap.needsUpdate = true

// ---- Loop: capped frame rate, paused while the tab/window is hidden.
const hud = document.getElementById('hud')
const timer = new THREE.Timer()
let last = 0, acc = 0, frames = 0, cpu = 0
window.__frames = 0
function frame(now) {
  requestAnimationFrame(frame)
  if (document.hidden) return
  if (now - last < 1000 / FPS_CAP - 1) return
  last = now
  timer.update(now)
  const dt = Math.min(timer.getDelta(), 0.1), t = timer.getElapsed()
  const t0 = performance.now()
  for (const a of actors) {
    a.mixer?.update(dt)
    a.update?.(t)
    if (a.walker) { a.root.position.x += dt * 0.45; if (a.root.position.x > a.walker.to) a.root.position.x = a.walker.from }
  }
  OUTLINE ? effect.render(scene, camera) : renderer.render(scene, camera)
  labels.render(scene, camera)
  cpu += performance.now() - t0
  frames++; window.__frames++
  if (now - acc > 1000) {
    hud.textContent = `${frames} fps (cap ${FPS_CAP}) · ${(cpu / frames).toFixed(1)} ms/frame CPU · ${renderer.info.render.calls} draw calls · ${(renderer.info.render.triangles / 1000).toFixed(0)}k tris · outline ${OUTLINE ? 'on' : 'off'}`
    acc = now; frames = 0; cpu = 0
  }
}
requestAnimationFrame(frame)
window.__ready = true
</script>
